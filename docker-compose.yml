version: '3.8'

services:
  # ==========================================
  # BASE DE DATOS MYSQL
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: mysql_hospital
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: db_hospital_vm
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ==========================================
  # RABBITMQ NODO 1 (LÍDER DEL CLÚSTER)
  # ==========================================
  rabbitmq1:
    image: rabbitmq:3-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      - RABBITMQ_ERLANG_COOKIE=SECRET_CLUSTER_DUOC_2025
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    ports:
      - "5672:5672"     # Protocolo AMQP
      - "15672:15672"   # Management Web UI (Nodo 1)
    networks:
      - hospital_network

  # ==========================================
  # RABBITMQ NODO 2 (INTEGRADO AL CLÚSTER)
  # ==========================================
  rabbitmq2:
    image: rabbitmq:3-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      - RABBITMQ_ERLANG_COOKIE=SECRET_CLUSTER_DUOC_2025
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    depends_on:
      - rabbitmq1
    ports:
      - "5673:5672"     # Protocolo AMQP (Nodo 2)
      - "15673:15672"   # Management Web UI (Nodo 2)
    networks:
      - hospital_network

  # ==========================================
  # MICROSERVICIO SPRING BOOT
  # ==========================================
  app:
    build: .
    container_name: hospital_app
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq1:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_hospital_vm?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_RABBITMQ_HOST: rabbitmq1
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    ports:
      - "8080:8080"
    networks:
      - hospital_network

volumes:
  mysql_data:

networks:
  hospital_network:
    driver: bridge
