spring.application.name=hospital

#Activar  perfil dev
#spring.profiles.active=dev
spring.datasource.url=jdbc:mysql://54.91.54.175:3306/db_hospital_vm?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# ==========================================
# CONFIGURACION CENTRALIZADA DE RABBITMQ
# ==========================================
spring.rabbitmq.host=54.91.54.175
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin123}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Exchanges
app.rabbitmq.exchange.direct=hospital.direct.exchange
app.rabbitmq.exchange.topic=hospital.topic.exchange
app.rabbitmq.exchange.dlx=hospital.dlx.exchange

# Colas y Dead Letter Queues (DLQ)
app.rabbitmq.queue.notifications=cola.notificaciones
app.rabbitmq.queue.notifications-dlq=cola.notificaciones.dlq

app.rabbitmq.queue.tickets=cola.tickets
app.rabbitmq.queue.tickets-dlq=cola.tickets.dlq

app.rabbitmq.queue.documents=cola.documentos
app.rabbitmq.queue.documents-dlq=cola.documentos.dlq

# Routing Keys
app.rabbitmq.routingkey.notifications=hospital.notificacion.key
app.rabbitmq.routingkey.tickets=hospital.ticket.*
app.rabbitmq.routingkey.documents=hospital.documento.key
app.rabbitmq.routingkey.dlq=hospital.dlq.key
